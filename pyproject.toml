[project]
name = "clastogen"
version = "0.10.0"
description = "Mutation testing for LLM evals: breaks your system prompt and checks if your pytest evals notice"
readme = "README.md"
license = "MIT"
authors = [{ name = "Burak Kaygusuz" }]
requires-python = ">=3.11"
keywords = ["llm", "mutation-testing", "pytest", "ai-agents", "sprt", "evaluations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Pytest",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pytest>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/burakkaygusuz/clastogen"
Repository = "https://github.com/burakkaygusuz/clastogen"
Issues = "https://github.com/burakkaygusuz/clastogen/issues"
Changelog = "https://github.com/burakkaygusuz/clastogen/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clastogen"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]

[project.entry-points.pytest11]
clastogen = "clastogen.plugin"

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "pytest-check>=3.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version}"
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.commit_parser_options]
patch_tags = ["fix", "perf", "refactor"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "ANN",
    "UP",
    "SIM",
    "PT",
    "S",
    "BLE",
    "PIE",
    "PERF",
    "RUF",
    "C901",
    "A",
    "C4",
    "DTZ",
    "ERA",
    "FA",
    "FURB",
    "G",
    "LOG",
    "PGH",
    "PLE",
    "PLW",
    "PTH",
    "PYI",
    "RET",
    "RSE",
    "TID",
    "TRY",
]
ignore = [
    "E501",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["S101", "S311"]
"examples/*" = ["S101", "S311"]
"src/clastogen/demo/*" = ["S101"]
"fuzz/*" = ["S101"]
"benchmarks/*" = ["S101", "S603", "S607"]

[tool.ty.environment]
extra-paths = ["benchmarks/support_desk"]

[tool.ty.analysis]
# Optional: the DeepEval example skips without deepeval; atheris is Linux-only.
allowed-unresolved-imports = ["deepeval.**", "atheris"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "benchmarks/support_desk"]
strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/clastogen"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
