[project]
name = "clastogen"
version = "0.12.2"
description = "Mutation testing for LLM evals: breaks your system prompt and checks if your pytest evals notice"
readme = "README.md"
license = "MIT"
authors = [{ name = "Burak Kaygusuz" }]
requires-python = ">=3.11"
keywords = ["llm", "mutation-testing", "pytest", "ai-agents", "sprt", "evaluations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Pytest",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pytest>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/burakkaygusuz/clastogen"
Repository = "https://github.com/burakkaygusuz/clastogen"
Issues = "https://github.com/burakkaygusuz/clastogen/issues"
Changelog = "https://github.com/burakkaygusuz/clastogen/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clastogen"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]

[project.entry-points.pytest11]
clastogen = "clastogen.plugin"

[dependency-groups]
dev = [
    "anthropic>=2.10.0",
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "openai>=3.55.1",
    "pytest-check>=3.1.0",
    "coverage>=7.17.3",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "ty>=0.0.106",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version}"
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.commit_parser_options]
patch_tags = ["fix", "perf", "refactor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--import-mode=importlib"]
strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/clastogen"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
