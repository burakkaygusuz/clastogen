name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version: "0.12.23"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run linter (Ruff)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run ruff check .

      - name: Check code formatting (Ruff)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run ruff format --check .

      - name: Run type checker (mypy)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run mypy src tests scripts

      - name: Run test suite with coverage
        run: uv run pytest --cov=clastogen --cov-report=xml

      - name: Run examples (demo and stats usage) under Clastogen with pytest-xdist
        run: uv run pytest --clastogen -n 2 examples/

      - name: Build and verify wheel distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          uv build
          uv run --isolated --no-project --with dist/*.whl python -c "import clastogen, clastogen.plugin; assert 'site-packages' in clastogen.__file__, clastogen.__file__; print(f'Imported clastogen {clastogen.__version__} from the wheel')"

  lowest-deps:
    name: test (lowest direct dependencies)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version: "0.12.23"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install lowest direct dependencies
        run: uv sync --dev --python 3.11 --resolution lowest-direct

      - name: Run test suite
        run: uv run --no-sync pytest

      - name: Run examples under Clastogen with pytest-xdist
        run: uv run --no-sync pytest --clastogen -n 2 examples/

  release:
    name: release
    needs: [test, lowest-deps]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Release only the tested commit
        run: git reset --hard ${{ github.sha }}

      - name: Version, tag and create GitHub release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.released == 'true'
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2
