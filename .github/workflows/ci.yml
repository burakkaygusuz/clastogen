name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.12.23"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run linter (Ruff)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run ruff check .

      - name: Check code formatting (Ruff)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run ruff format --check .

      - name: Run type checker (mypy)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run mypy src tests scripts

      - name: Run test suite with coverage
        run: uv run pytest --cov=clastogen --cov-report=xml

      - name: Run examples (demo and stats usage) under Clastogen with pytest-xdist
        run: uv run pytest --clastogen -n 2 examples/

      - name: Build and verify wheel distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          uv build
          uv run --isolated --no-project --with dist/*.whl python -c "import clastogen, clastogen.plugin; assert 'site-packages' in clastogen.__file__, clastogen.__file__; print(f'Imported clastogen {clastogen.__version__} from the wheel')"

  lowest-deps:
    name: test (lowest direct dependencies)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.12.23"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install lowest direct dependencies
        run: uv sync --dev --python 3.11 --resolution lowest-direct

      - name: Run test suite
        run: uv run --no-sync --python 3.11 pytest

      - name: Run examples under Clastogen with pytest-xdist
        run: uv run --no-sync --python 3.11 pytest --clastogen -n 2 examples/

  release:
    name: release
    needs: [test, lowest-deps]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      released: ${{ steps.release.outputs.released }}

    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Release only the tested commit
        run: git reset --hard ${{ github.sha }}

      - name: Version, tag and create GitHub release
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          changelog: "false"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.release.outputs.released == 'true'
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
