name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Release this bump even if no commit since the last release triggers one
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run linter (Ruff)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run ruff check .

      - name: Check code formatting (Ruff)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run ruff format --check .

      - name: Run type checker (ty)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run ty check

      - name: Run test suite with coverage
        run: uv run pytest --cov=clastogen --cov-report=xml

      - name: Run examples (demo and stats usage) under Clastogen with pytest-xdist
        run: uv run pytest --clastogen -n 2 examples/

      - name: Build and verify distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          uv build
          for dist in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$dist" python -c "import clastogen, clastogen.plugin; assert 'site-packages' in clastogen.__file__, clastogen.__file__; print(f'Imported clastogen {clastogen.__version__} from $dist')"
          done

  lowest-deps:
    name: test (lowest direct dependencies)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.11"

      - name: Install lowest direct dependencies
        run: uv sync --resolution lowest-direct

      - name: Run test suite
        run: uv run --no-sync pytest

      - name: Run examples under Clastogen with pytest-xdist
        run: uv run --no-sync pytest --clastogen -n 2 examples/

  pytest-pre:
    name: test (pytest pre-release)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Install dependencies with latest pytest pre-release
        run: |
          uv sync --locked
          uv pip install --upgrade --prerelease allow pytest

      - name: Run test suite
        run: uv run --no-sync pytest

      - name: Run examples under Clastogen with pytest-xdist
        run: uv run --no-sync pytest --clastogen -n 2 examples/

  fuzz:
    name: fuzz (atheris)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"

      - name: Fuzz prompt mutation and Markdown escaping
        run: uv run --locked --with atheris==3.1.0 python fuzz/fuzz_prompt.py -max_total_time=60

  release:
    name: release
    needs: [test, lowest-deps]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      released: ${{ steps.release.outputs.released }}

    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Release only the tested commit
        run: git reset --hard ${{ github.sha }}

      - name: Version, tag and create GitHub release
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          changelog: "false"
          # Empty on push: only fix, perf and refactor commits release then.
          force: ${{ inputs.force }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.released == 'true'
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        id: attest
        if: steps.release.outputs.released == 'true'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Install uv
        if: steps.release.outputs.released == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Attach signed CycloneDX SBOM and build provenance to the GitHub release
        if: steps.release.outputs.released == 'true'
        # The tag and release already exist here; a failed upload must not block the PyPI publish.
        # Upload only after signing: an unsigned release asset scores 0 on Scorecard's Signed-Releases check.
        # The attestation bundle is JSON Lines; the .intoto.jsonl suffix is what Scorecard counts as provenance.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          uv export --format cyclonedx1.5 --no-dev --locked -o "clastogen-$VERSION.cdx.json"
          uvx sigstore@4.5.0 sign "clastogen-$VERSION.cdx.json"
          cp "$BUNDLE" "clastogen-$VERSION.intoto.jsonl"
          gh release upload "$TAG" "clastogen-$VERSION.cdx.json" "clastogen-$VERSION.cdx.json.sigstore.json" "clastogen-$VERSION.intoto.jsonl"

  publish:
    name: publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
