name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: Include the command you ran and the full output.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal reproduction
      description: The smallest test file that shows the problem.
      render: python
    validations:
      required: true
  - type: input
    attributes:
      label: Versions
      description: clastogen, pytest, Python and OS.
      placeholder: clastogen 0.2.0, pytest 8.4.2, Python 3.13, macOS 15
    validations:
      required: true
