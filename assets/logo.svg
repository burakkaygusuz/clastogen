<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#141A29"/>
      <stop offset="60%" stop-color="#090D15"/>
      <stop offset="100%" stop-color="#040609"/>
    </radialGradient>

    <linearGradient id="mainBodyGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="40%" stop-color="#6366F1"/>
      <stop offset="75%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="mutantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="mutantFloat" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-3" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    
    
    <style>
      .clastogen-title { fill: #0F172A; }
      .clastogen-sub { fill: #475569; }
      .clastogen-badge-bg { fill: #EEF2FF; stroke: #C7D2FE; }
      .clastogen-badge-text { fill: #4338CA; }
      .clastogen-chevron { stroke: #0F172A; }
      .clastogen-ambient { display: none; }
      @media (prefers-color-scheme: dark) {
        .clastogen-title { fill: #F8FAFC; }
        .clastogen-sub { fill: #94A3B8; }
        .clastogen-badge-bg { fill: rgba(99, 102, 241, 0.15); stroke: rgba(129, 140, 248, 0.35); }
        .clastogen-badge-text { fill: #A5B4FC; }
        .clastogen-chevron { stroke: #FFFFFF; }
        .clastogen-ambient { display: block; }
      }
    </style>
    
  </defs>

  <g class="clastogen-ambient">
    <circle cx="95" cy="90" r="75" fill="url(#ambientGlow)" opacity="0.8"/>
  </g>

  <!-- Clean Glyph on the Left -->
  <g id="clastogen-glyph">
    
    <!-- 1. Baseline Prompt 'C' Backbone -->
    <path d="M 114.93 15.62 A 77.00 77.00 0 1 0 155.68 137.41 A 11.00 11.00 0 0 0 138.34 123.86 A 55.00 55.00 0 1 1 109.24 36.87 Z" fill="url(#mainBodyGrad)"/>

    <!-- 2. Clastogenic Cleavage Cut Interface -->
    <line x1="109.24" y1="36.87" x2="114.93" y2="15.62"
          stroke="#38BDF8"
          stroke-width="1.32"
          stroke-linecap="round"
          opacity="0.9"/>

    <!-- 3. Displaced Mutant Segment (Controlled Injected Fault) -->
    <g filter="url(#mutantFloat)">
      <path d="M 137.75 15.41 A 77.00 77.00 0 0 1 170.81 49.65 A 11.00 11.00 0 0 1 151.03 59.29 A 55.00 55.00 0 0 0 127.42 34.84 Z" fill="url(#mutantGrad)"/>
      <line x1="127.42" y1="34.84" x2="137.75" y2="15.41"
            stroke="#6EE7B7"
            stroke-width="1.54"
            stroke-linecap="round"/>
    </g>

    <!-- 4. Central Focal Prompt Chevron '>' -->
    <path d="M 81.80 66.24 L 105.56 90.00 L 81.80 113.76"
          fill="none"
          class="clastogen-chevron"
          stroke-width="13.20"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
  </g>

  <!-- Typography -->
  <g transform="translate(192, 106)">
    <text class="clastogen-title"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif"
          font-size="52"
          font-weight="800"
          letter-spacing="-0.035em">clastogen</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(194, 136)">
    <text class="clastogen-sub"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, sans-serif"
          font-size="12.5"
          font-weight="600"
          letter-spacing="0.1em"
          text-transform="uppercase">Mutation Testing for LLMs &amp; AI Agents</text>
  </g>

  <!-- SPRT Badge -->
  <g transform="translate(460, 78)">
    <rect class="clastogen-badge-bg" width="138" height="26" rx="13" stroke-width="1.5"/>
    <text class="clastogen-badge-text"
          x="69" y="17"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10.5"
          font-weight="700"
          letter-spacing="0.08em"
          text-anchor="middle">SPRT POWERED</text>
  </g>
</svg>