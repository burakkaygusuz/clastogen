<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#121829"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#040609"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mainBodyGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="mutantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="floatShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-3" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    
    <style>
      .clastogen-title { fill: #0F172A; }
      .clastogen-sub { fill: #475569; }
      .clastogen-badge-bg { fill: #EEF2FF; stroke: #C7D2FE; }
      .clastogen-badge-text { fill: #4338CA; }
      .clastogen-chevron { stroke: #0F172A; }
      .clastogen-ambient-glow { display: none; }
      @media (prefers-color-scheme: dark) {
        .clastogen-title { fill: #F8FAFC; }
        .clastogen-sub { fill: #94A3B8; }
        .clastogen-badge-bg { fill: rgba(99, 102, 241, 0.15); stroke: rgba(129, 140, 248, 0.35); }
        .clastogen-badge-text { fill: #A5B4FC; }
        .clastogen-chevron { stroke: #FFFFFF; }
        .clastogen-ambient-glow { display: block; }
      }
    </style>
    
  </defs>

  <!-- Ambient Light (dark mode only) -->
  <g class="clastogen-ambient-glow">
    <circle cx="95" cy="90" r="75" fill="url(#glowViolet)" opacity="0.6"/>
    <circle cx="130" cy="60" r="60" fill="url(#glowEmerald)" opacity="0.6"/>
  </g>

  <!-- Logo Glyph -->
  <g id="clastogen-glyph">
    
    <!-- Base-pair rungs (DNA Ladder) -->
    <g id="dna-rungs">
      <line x1="73.44" y1="127.34" x2="68.50" y2="135.90" stroke="url(#baseGrad)" stroke-width="1.98" stroke-linecap="round" opacity="0.45"/>
    <line x1="57.66" y1="111.56" x2="49.10" y2="116.50" stroke="url(#baseGrad)" stroke-width="1.98" stroke-linecap="round" opacity="0.45"/>
    <line x1="51.88" y1="90.00" x2="42.00" y2="90.00" stroke="url(#baseGrad)" stroke-width="1.98" stroke-linecap="round" opacity="0.45"/>
    <line x1="57.66" y1="68.44" x2="49.10" y2="63.50" stroke="url(#baseGrad)" stroke-width="1.98" stroke-linecap="round" opacity="0.45"/>
    <line x1="73.44" y1="52.66" x2="68.50" y2="44.10" stroke="url(#baseGrad)" stroke-width="1.98" stroke-linecap="round" opacity="0.45"/>
    </g>

    <!-- Inner Helix Ribbon (Baseline Chromatid Arc) -->
    <path d="M 122.72 123.03 A 43.12 43.12 0 1 1 95.00 46.88"
          fill="none"
          stroke="#6366F1"
          stroke-opacity="0.32"
          stroke-width="5.72"
          stroke-linecap="round"/>

    <!-- Centromere node (Genetic pivot point) -->
    <circle cx="30.32" cy="90.00" r="2.20" fill="#A78BFA" opacity="0.8"/>

    <!-- Main 'C' Backbone (Wild-Type Prompt Structure) -->
    <path d="M 112.78 18.70 A 73.48 73.48 0 1 0 152.90 135.24 A 9.24 9.24 0 0 0 138.34 123.86 A 55.00 55.00 0 1 1 108.31 36.63 Z" fill="url(#mainBodyGrad)"/>

    <!-- Cleavage cut plane (Clastogenic shear plane) -->
    <line x1="108.31" y1="36.63" x2="112.78" y2="18.70"
          stroke="#38BDF8"
          stroke-width="1.10"
          stroke-linecap="round"
          opacity="0.85"/>

    <!-- Displaced Mutant Segment (Injected Fault) -->
    <g filter="url(#floatShadow)">
      <path d="M 135.22 19.40 A 73.48 73.48 0 0 1 165.60 49.78 A 9.24 9.24 0 0 1 149.28 58.46 A 55.00 55.00 0 0 0 126.54 35.72 Z" fill="url(#mutantGrad)"/>
      <line x1="126.54" y1="35.72" x2="135.22" y2="19.40"
            stroke="#6EE7B7"
            stroke-width="1.32"
            stroke-linecap="round"/>
    </g>

    <!-- Mutation Spark -->
    <circle cx="119.66" cy="27.21" r="1.76" fill="#A7F3D0"/>

    <!-- Central Prompt Chevron '>' (LLM prompt, test execution) -->
    <path d="M 85.32 70.64 L 106.44 90.00 L 85.32 109.36"
          fill="none"
          class="clastogen-chevron"
          stroke-width="11.44"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- SPRT Sequential Step Dot -->
    <circle cx="121.40" cy="108.48" r="3.52" fill="#38BDF8"/>
    
  </g>

  <!-- Brand Typography -->
  <g transform="translate(192, 106)">
    <text class="clastogen-title"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif"
          font-size="52"
          font-weight="800"
          letter-spacing="-0.035em">clastogen</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(194, 136)">
    <text class="clastogen-sub"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, sans-serif"
          font-size="12.5"
          font-weight="600"
          letter-spacing="0.1em"
          text-transform="uppercase">Mutation Testing for LLMs &amp; AI Agents</text>
  </g>

  <!-- SPRT Badge -->
  <g transform="translate(460, 78)">
    <rect class="clastogen-badge-bg" width="138" height="26" rx="13" stroke-width="1.5"/>
    <text class="clastogen-badge-text"
          x="69" y="17"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10.5"
          font-weight="700"
          letter-spacing="0.08em"
          text-anchor="middle">SPRT POWERED</text>
  </g>
</svg>