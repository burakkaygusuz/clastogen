<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#121829"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#040609"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mainBodyGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="mutantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="floatShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-3" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="210" cy="270" r="190" fill="url(#glowViolet)"/>
  <circle cx="360" cy="140" r="150" fill="url(#glowEmerald)"/>
  
    <!-- Base-pair rungs (DNA Ladder) -->
    <g id="dna-rungs">
      <line x1="207.00" y1="340.87" x2="194.50" y2="362.52" stroke="url(#baseGrad)" stroke-width="4.50" stroke-linecap="round" opacity="0.45"/>
    <line x1="171.13" y1="305.00" x2="149.48" y2="317.50" stroke="url(#baseGrad)" stroke-width="4.50" stroke-linecap="round" opacity="0.45"/>
    <line x1="158.00" y1="256.00" x2="133.00" y2="256.00" stroke="url(#baseGrad)" stroke-width="4.50" stroke-linecap="round" opacity="0.45"/>
    <line x1="171.13" y1="207.00" x2="149.48" y2="194.50" stroke="url(#baseGrad)" stroke-width="4.50" stroke-linecap="round" opacity="0.45"/>
    <line x1="207.00" y1="171.13" x2="194.50" y2="149.48" stroke="url(#baseGrad)" stroke-width="4.50" stroke-linecap="round" opacity="0.45"/>
    </g>

    <!-- Inner Helix Ribbon (Baseline Chromatid Arc) -->
    <path d="M 318.99 331.07 A 98.00 98.00 0 1 1 256.00 158.00"
          fill="none"
          stroke="#6366F1"
          stroke-opacity="0.32"
          stroke-width="13.00"
          stroke-linecap="round"/>

    <!-- Centromere node (Genetic pivot point) -->
    <circle cx="109.00" cy="256.00" r="5.00" fill="#A78BFA" opacity="0.8"/>

    <!-- Main 'C' Backbone (Wild-Type Prompt Structure) -->
    <path d="M 296.40 93.96 A 167.00 167.00 0 1 0 387.60 358.82 A 21.00 21.00 0 0 0 354.50 332.96 A 125.00 125.00 0 1 1 286.24 134.71 Z" fill="url(#mainBodyGrad)"/>

    <!-- Cleavage cut plane (Clastogenic shear plane) -->
    <line x1="286.24" y1="134.71" x2="296.40" y2="93.96"
          stroke="#38BDF8"
          stroke-width="2.50"
          stroke-linecap="round"
          opacity="0.85"/>

    <!-- Displaced Mutant Segment (Injected Fault) -->
    <g filter="url(#floatShadow)">
      <path d="M 347.40 95.55 A 167.00 167.00 0 0 1 416.45 164.60 A 21.00 21.00 0 0 1 379.37 184.32 A 125.00 125.00 0 0 0 327.68 132.63 Z" fill="url(#mutantGrad)"/>
      <line x1="327.68" y1="132.63" x2="347.40" y2="95.55"
            stroke="#6EE7B7"
            stroke-width="3.00"
            stroke-linecap="round"/>
    </g>

    <!-- Mutation Spark -->
    <circle cx="312.04" cy="113.30" r="4.00" fill="#A7F3D0"/>

    <!-- Central Prompt Chevron '>' (LLM prompt, test execution) -->
    <path d="M 234.00 212.00 L 282.00 256.00 L 234.00 300.00"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="26.00"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- SPRT Sequential Step Dot -->
    <circle cx="316.00" cy="298.00" r="8.00" fill="#38BDF8"/>
    
</svg>