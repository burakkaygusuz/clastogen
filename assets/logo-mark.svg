<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#141A29"/>
      <stop offset="60%" stop-color="#090D15"/>
      <stop offset="100%" stop-color="#040609"/>
    </radialGradient>

    <linearGradient id="mainBodyGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="40%" stop-color="#6366F1"/>
      <stop offset="75%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="mutantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="mutantFloat" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-3" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="256" cy="256" r="210" fill="url(#ambientGlow)"/>
  
    <!-- 1. Baseline Prompt 'C' Backbone -->
    <path d="M 301.29 86.96 A 175.00 175.00 0 1 0 393.90 363.74 A 25.00 25.00 0 0 0 354.50 332.96 A 125.00 125.00 0 1 1 288.35 135.26 Z" fill="url(#mainBodyGrad)"/>

    <!-- 2. Clastogenic Cleavage Cut Interface -->
    <line x1="288.35" y1="135.26" x2="301.29" y2="86.96"
          stroke="#38BDF8"
          stroke-width="3.00"
          stroke-linecap="round"
          opacity="0.9"/>

    <!-- 3. Displaced Mutant Segment (Controlled Injected Fault) -->
    <g filter="url(#mutantFloat)">
      <path d="M 353.16 86.48 A 175.00 175.00 0 0 1 428.29 164.29 A 25.00 25.00 0 0 1 383.35 186.20 A 125.00 125.00 0 0 0 329.68 130.63 Z" fill="url(#mutantGrad)"/>
      <line x1="329.68" y1="130.63" x2="353.16" y2="86.48"
            stroke="#6EE7B7"
            stroke-width="3.50"
            stroke-linecap="round"/>
    </g>

    <!-- 4. Central Focal Prompt Chevron '>' -->
    <path d="M 226.00 202.00 L 280.00 256.00 L 226.00 310.00"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="30.00"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
</svg>